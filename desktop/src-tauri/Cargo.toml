[package]
name = "adarbot-desktop"
version = "0.1.0"
description = "Cliente multiplataforma de adarbot"
authors = ["adardev"]
edition = "2021"

[lib]
name = "adarbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
